[project]
name = "backend"
version = "0.1.0"
description = "Lottery Intelligence Platform backend (FastAPI foundation)"
authors = [
    { name = "guigerdts", email = "guigerdts1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
