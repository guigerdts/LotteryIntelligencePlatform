[project]
name = "backend"
version = "0.1.0"
description = "Lottery Intelligence Platform backend (FastAPI foundation)"
authors = [
    { name = "guigerdts", email = "guigerdts1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "python-multipart>=0.0.12",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    # Fase 7 — Machine Learning. ALLOWLIST EXCEPTION to the F6 stdlib-only gate
    # (graph D8): scikit-learn (with numpy) is the ONLY permitted runtime dep for
    # ml/; signed exception registered 2026-08-09 (proposal D1, M-A9). Exact-pinned
    # for reproducibility. xgboost/lightgbm/catboost/networkx remain BANNED (future-ml
    # declared-but-never-executed, MLE-07); the dependency gate test asserts their
    # absence from installable deps (tests/test_ml_pr1.py::test_no_future_ml_imports).
    "numpy==2.2.6",
    "scikit-learn==1.6.1",
    # Fase 8 — Deep Learning. ALLOWLIST EXCEPTION to the F6 stdlib-only gate
    # (proposal D1, DLE-06): PyTorch CPU-only is the ONLY permitted runtime dep for
    # dl/; signed exception registered 2026-08-09, limited to torch/Fase-8. Exact-pinned
    # for reproducibility. torch transitively depends on networkx — this is an explicit,
    # documented exception to the networkx ban, scoped exclusively to PyTorch/Fase-8.
    # The dependency gate test (test_dl_pr1.py) asserts torch is present and the ban-gate
    # test (test_ml_pr1.py) continues to enforce networkx absence from installable deps.
    # NOTE: torch 2.5.1 lacks cp313 wheels; 2.13.0+cpu is the first stable CPU-only
    # release with Python 3.13 support (resolved at apply, 2026-08-09).
    "torch==2.13.0+cpu",
    # Fase 9 — Optimization Engine. ALLOWLIST EXCEPTION to the F6 stdlib-only gate
    # (proposal D2, OE-09): deap is the ONLY permitted runtime dep for opt/ga.py;
    # signed exception registered 2026-08-10, limited to opt/Fase-9. Exact-pinned
    # for reproducibility. The dependency gate test (test_opt_pr1.py) asserts deap
    # is present and the ban-gate tests (test_ml_pr1.py, test_dl_pr1.py) enforce
    # deap absence from the F7/F8 trees.
    "deap==1.4.1",
    # Fase 9 — Optimization Engine. ALLOWLIST EXCEPTION to the F6 stdlib-only gate
    # (proposal D2, OE-09): optuna is the ONLY permitted runtime dep for opt/bayesian.py;
    # signed exception registered 2026-08-10, limited to opt/Fase-9. Exact-pinned
    # for reproducibility. The dependency gate test (test_opt_pr1.py) asserts optuna
    # is present and the ban-gate tests (test_ml_pr1.py, test_dl_pr1.py) enforce
    # optuna absence from the F7/F8 trees.
    "optuna==4.0.0",
]

# Optional dialect extra: PostgreSQL driver for the CI-gated dialect smoke
# (tests/test_dialect_compat.py). NOT a hard dependency — SQLite is the default
# and works with zero DB drivers; install with `uv sync --extra dialect-pg` only
# when exercising the PG portability path.
[project.optional-dependencies]
dialect-pg = ["psycopg[binary]>=3.2.0"]

[project.scripts]
lip = "backend.app.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Alternating test modules that share a basename across directories tree
# (e.g. tests/probability/test_fingerprint.py and tests/feature_engineering/
# test_fingerprint.py) must import by unique file hash, not bare module.
addopts = "--import-mode=importlib"

[tool.coverage.run]
# Instrument only the app package; tests and third-party deps stay out of the
# measured surface (TEST-002, ADR-3). Measured by `pytest --cov=backend.app`.
source = ["backend.app"]

[tool.coverage.report]
# Report-only baseline (D1): show missing lines for gap-filling (S3) but NEVER
# fail on coverage alone — the CI script evaluates the history artifact, and
# fail_under stays unset so `coverage report`/pytest-cov always exits 0 on low
# coverage during establishment.
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# env.py must patch sys.path before importing the src-layout app package,
# so its imports legitimately follow statements (E402) and split blocks (I001).
"alembic/env.py" = ["E402", "I001"]
