# Alembic configuration — sole schema owner (REQ-09).
# sqlalchemy.url is intentionally NOT set here: env.py falls back to the app
# settings (backend.app.config.settings, LIP_DATABASE_URL / .env) so the dialect
# stays config-driven (REQ-05).

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s|%(levelname)s|%(name)s|%(message)s
datefmt = %H:%M:%S
