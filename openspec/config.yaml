# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3 + FastAPI backend; React + Vite + Tailwind frontend; SQLite
  database; ML with Scikit-Learn/XGBoost/LightGBM/CatBoost; DL with PyTorch;
  plotting with Plotly/ECharts; processing with Pandas/NumPy/SciPy/Polars.
  Architecture: modular, layered (Presentation / API / Application / Domain / Data);
  independent engines (Data, Statistics, Probability, Feature, ML, DL,
  Optimization, Generator, Backtesting, Experiment, Graph) behind well-defined
  interfaces; config outside code; observability (logs, errors, timing,
  resource usage, model versions).
  Testing: pytest runner detected in backend/ (Python 3.13 on .venv; runner
  `backend/.venv/bin/pytest`, ruff linter+formatter). enabled as of 2026-08-06.
  Style: modularity, low coupling, high cohesion, reproducibility, extensibility;
  Spanish project documentation, English technical artifacts per SDD contract.
  Project state: Fase 0 (Design & Architecture) per README; IMPLEMENTATION_ROADMAP.md
  defines Fases 0-19 with a strict dependency chain and Definition of Done.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Record inconsistencies, missing dependencies, and architectural improvements found in project docs before implementation
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Respect IMPLEMENTATION_ROADMAP.md phase ordering
    tdd: true            # pytest detected in backend (2026-08-06)
    test_command: "backend/.venv/bin/pytest"
  verify:
    test_command: "backend/.venv/bin/pytest"
    build_command: "backend/.venv/bin/ruff check ."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true       # pytest detected in backend (2026-08-06)
  runner: "backend/.venv/bin/pytest"
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  quality:
    linter: true         # ruff
    typechecker: false
    formatter: true      # ruff format
